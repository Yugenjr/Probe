      - "-y"
      - "@modelcontextprotocol/server-github"
    env:
      GITHUB_PERSONAL_ACCESS_TOKEN: "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"

