[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "driftguard-probe"
version = "0.1.0"
description = "Production-grade, platform-agnostic Autonomous ML Investigation Engine"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "DriftGuard Probe Architecture Team" },
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.1",
    "httpx>=0.27.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-exporter-otlp>=1.24.0",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    "mcp>=0.1.0",
    "tenacity>=8.3.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.6",
    "pytest-cov>=5.0.0",
    "mypy>=1.10.0",
    "ruff>=0.4.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[project.scripts]
probe = "probe.cli.main:main"

[project.entry-points."probe.adapters"]
driftguard = "probe_adapters.driftguard.client:DriftGuardAdapter"
whylabs = "probe_adapters.whylabs.client:WhyLabsTelemetryAdapter"
evidently = "probe_adapters.evidently.client:EvidentlyTelemetryAdapter"
arize = "probe_adapters.arize.client:ArizeTelemetryAdapter"

